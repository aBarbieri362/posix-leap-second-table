[project]
name = "posix-leap-second-table"
version = "0.1.2"
description = "Parses and serves the IETF leap-seconds.list file, providing TAI-UTC offset lookups by Unix timestamp."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
